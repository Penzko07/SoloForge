name: Release Desktop Builds

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            command: npm run dist:win -- --publish never
          - name: Linux
            os: ubuntu-latest
            command: npm run dist:linux -- --publish never
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install desktop dependencies
        run: npm install

      - name: Build desktop package
        run: ${{ matrix.command }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SoloForge-*
