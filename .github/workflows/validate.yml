name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate registry
        run: python3 tools/validate_registry.py

      - name: Run tests
        run: python3 -m unittest discover -s tests
