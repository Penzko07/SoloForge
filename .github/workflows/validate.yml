name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate registry
        run: python3 tools/validate_registry.py

      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Check Python syntax
        run: python3 -m py_compile tools/*.py

      - name: Check desktop JavaScript syntax
        run: |
          node --check apps/desktop/app.js
          node --check apps/electron/main.cjs
          node --check apps/electron/preload.cjs
          node --check apps/electron/scanner.cjs
          node --check apps/electron/trainer-runtime.cjs

      - name: Verify generated desktop data
        run: |
          python3 tools/update_app_data.py
          git diff --exit-code apps/desktop/app-data.js

      - name: Validate package metadata
        run: node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"

  macos-app:
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build macOS app
        run: bash tools/build_macos_app.sh

      - name: Archive macOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/SoloForge.app build/macos/SoloForge-macos.zip

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoloForge-macos
          path: build/macos/SoloForge-macos.zip

  desktop-installers:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            command: npm run dist:win -- --publish never
            artifact: SoloForge-windows
          - name: Linux
            os: ubuntu-latest
            command: npm run dist:linux -- --publish never
            artifact: SoloForge-linux
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux packaging dependencies
        if: matrix.name == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Install desktop dependencies
        run: npm install

      - name: Build installer
        run: ${{ matrix.command }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/SoloForge-*
